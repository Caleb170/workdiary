<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0B0D12; --bg-2:#12151C; --card:#161A23; --card-2:#1D2230;
  --line:#262B38; --line-soft:#1E222D;
  --text:#F4F5F7; --text-dim:#9AA1B2; --text-faint:#5C6377;
  --green:#34D399; --green-dim:#0F2B22;
  --amber:#F5B44D; --amber-dim:#2E2311;
  --rust:#F16C6C; --rust-dim:#2E1717;
  --accent:#7C9CFF;
  --radius:16px; --radius-sm:10px;
}
[data-theme="light"]{
  --bg:#F6F5F1; --bg-2:#FFFFFF; --card:#FFFFFF; --card-2:#EFEDE6;
  --line:#E3E0D6; --line-soft:#ECE9DF;
  --text:#1B1D22; --text-dim:#6B7180; --text-faint:#9CA1AD;
  --green:#1D9A6C; --green-dim:#E3F5EC;
  --amber:#B8792A; --amber-dim:#FBF0DE;
  --rust:#C24A3E; --rust-dim:#FBEAE7;
  --accent:#5B6FE0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  transition:background 0.25s ease, color 0.25s ease;
}
:root{ --on-accent:#0B0D12; --bg-rgb:11,13,18; }
[data-theme="light"]{ --on-accent:#FFFFFF; --bg-rgb:246,245,241; }
.num,.money{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;color:var(--text);margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-2);color:var(--text);font-size:15px;font-family:'Inter',sans-serif;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
label{font-size:12px;font-weight:600;color:var(--text-dim);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hidden{display:none !important;}

/* ---- Login ---- */
#login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.login-title{font-family:'Fraunces',serif;font-size:34px;font-weight:700;letter-spacing:-0.01em;}
.login-sub{color:var(--text-dim);font-size:14px;margin:6px 0 32px;}
.pin-boxes{display:flex;gap:10px;margin-bottom:24px;}
.pin-boxes input{
  width:52px;height:60px;text-align:center;font-size:24px;font-family:'IBM Plex Mono';
  border-radius:12px;background:var(--card);border:1px solid var(--line);
}
.login-btn{
  width:100%;max-width:280px;padding:14px;border-radius:12px;border:none;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;
}
.login-btn:disabled{opacity:0.4;}
.login-error{color:var(--rust);font-size:13px;margin-top:14px;min-height:18px;}
.login-loading{color:var(--text-dim);font-size:13px;margin-top:14px;}

/* ---- App shell ---- */
#app-screen{max-width:640px;margin:0 auto;padding:0 16px 100px;}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(var(--bg-rgb),0.85);backdrop-filter:blur(14px);
  padding:16px 16px 10px;margin:0 -16px;border-bottom:1px solid var(--line-soft);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;}
.role-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card-2);color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;}
.sync-pill{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);
  padding:5px 10px;border-radius:999px;background:var(--card-2);
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
.sync-dot.saved{background:var(--green);}
.sync-dot.saving{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--rust);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);
  color:var(--text-dim);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;
}
.icon-btn:active{transform:scale(0.94);}

.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;}
.tab{
  background:none;border:none;color:var(--text-faint);padding:8px 4px 10px;
  font-size:13.5px;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent;flex:1;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}

.section{padding-top:20px;}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);}
.card-pad{padding:18px;}
.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:0.09em;font-weight:700;color:var(--text-faint);margin:0 0 4px;}
.muted{color:var(--text-dim);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:8px;}
.row.wrap{flex-wrap:wrap;}
.spacer{flex:1;}

.btn{border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--text);padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.btn-danger{color:var(--rust);border-color:var(--rust-dim);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.fab{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:var(--on-accent);border:none;border-radius:999px;
  padding:15px 26px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(124,156,255,0.35);
  z-index:50;display:flex;align-items:center;gap:8px;
}
/* ---- Theme toggle ---- */
.theme-toggle{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text);
  position:relative;overflow:hidden;
}
.theme-toggle:active{transform:scale(0.94);}

/* ---- FY selector ---- */
.fy-pill{position:relative;}
.fy-pill-btn{
  background:var(--card-2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;
}
.fy-menu{
  position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-2);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.3);min-width:120px;overflow:hidden;z-index:60;
}
.fy-menu button{display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:none;font-size:13.5px;color:var(--text);}
.fy-menu button:hover{background:var(--card-2);}
.fy-menu button.cur{color:var(--accent);font-weight:700;}

/* ---- Calendar ---- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;padding-bottom:6px;}
.cal-cell{min-height:58px;border-radius:10px;padding:6px 5px;font-size:11.5px;background:var(--card);border:1px solid var(--line-soft);position:relative;}
.cal-cell.blank{background:transparent;border:none;}
.cal-cell.today{border-color:var(--accent);border-width:1.5px;}
.cal-cell.worked{background:var(--green-dim);}
.cal-cell.planned{background:var(--amber-dim);}
.cal-cell.future{background:var(--amber-dim);}
.cal-cell.holiday{background:var(--rust-dim);}
.cal-cell.holiday .d{color:var(--rust);}
.cal-cell .na{color:var(--rust);font-weight:700;font-size:10px;margin-top:4px;display:block;}
.st-future{background:var(--amber-dim);color:var(--amber);}
.st-holiday{background:var(--rust-dim);color:var(--rust);}
.day-card.holiday{border-color:var(--rust-dim);}
.cal-cell button{all:unset;display:block;width:100%;height:100%;cursor:pointer;}
.cal-cell .d{font-weight:700;font-size:12px;color:var(--text);}
.cal-cell .amt{color:var(--green);font-weight:700;font-size:10.5px;margin-top:4px;display:block;}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:5px;}
.cal-legend{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);}
.cal-legend .sw{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}

/* ---- Timeline ---- */
.tl-month h3{font-size:15px;margin:18px 0 8px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;font-family:'Inter';font-weight:700;}
.tl-week{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.tl-week .rng{flex:1;color:var(--text-dim);}
.tl-week .hrs{color:var(--text-faint);width:64px;text-align:right;font-size:12px;}
.tl-week .amt{font-weight:700;color:var(--green);width:80px;text-align:right;}

/* ---- Search ---- */
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.search-box input{border:none;background:none;padding:0;font-size:15px;}
.search-box input:focus{outline:none;}
.search-result{padding:11px 4px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;font-size:13.5px;align-items:center;}
.search-result:active{opacity:0.7;}

/* ---- Tax ---- */
.tax-hero{background:linear-gradient(160deg,var(--card),var(--card-2));border:1px solid var(--line-soft);border-radius:18px;padding:22px;text-align:center;margin-bottom:16px;}
.tax-hero .big-num{font-family:'Fraunces',serif;font-weight:700;font-size:36px;margin:6px 0;}
.tax-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px;}
.tax-row:first-child{border-top:none;}
.tax-estimate-badge{display:inline-block;background:var(--amber-dim);color:var(--amber);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
.bracket-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:12px 0 6px;background:var(--line-soft);}
.bracket-bar .seg{height:100%;}

/* ---- On-shift live ticker ---- */
.onshift-banner{
  display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--green-dim),var(--card));
  border:1px solid var(--green);border-radius:14px;padding:12px 14px;margin:16px 0 4px;cursor:pointer;
}
.onshift-dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;flex-shrink:0;}
.onshift-banner .label{font-weight:700;font-size:13.5px;flex:1;}
.onshift-banner .amt{font-family:'IBM Plex Mono';font-weight:700;color:var(--green);font-size:15px;}
.ticker-num{font-family:'Fraunces',serif;font-weight:700;font-size:44px;text-align:center;color:var(--green);margin:14px 0 4px;}
.ticker-sub{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.ticker-onbreak{background:var(--amber-dim);color:var(--amber);text-align:center;padding:8px;border-radius:10px;font-size:12.5px;font-weight:700;margin-bottom:14px;}

.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.week-nav-btn{background:var(--card-2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:15px;}
.week-total{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--green);}

.day-card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.day-card.today{border-color:var(--accent);}
.day-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.day-dow{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
.day-date{color:var(--text-faint);font-size:12px;margin-left:6px;}
.day-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
.st-worked{background:var(--green-dim);color:var(--green);}
.st-planned{background:var(--amber-dim);color:var(--amber);}
.st-none{background:var(--card-2);color:var(--text-faint);}
.shift-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13.5px;}
.shift-row:first-of-type{border-top:none;}
.shift-emp{font-weight:600;}
.shift-time{color:var(--text-dim);font-size:12.5px;}
.shift-amt{margin-left:auto;font-weight:700;color:var(--green);}
.shift-actions{display:flex;gap:4px;}
.day-empty{color:var(--text-faint);font-size:13px;font-style:italic;padding:2px 0;}
.day-total{text-align:right;font-size:13px;font-weight:700;color:var(--green);margin-top:6px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:640px){.modal-backdrop{align-items:center;}}
.modal{background:var(--bg-2);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px;border-top:1px solid var(--line);}
@media(min-width:640px){.modal{border-radius:18px;}}
.modal h3{margin:0 0 16px;font-size:19px;}
.modal-close{float:right;background:none;border:none;font-size:20px;color:var(--text-dim);}
.calc-preview{background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:12px;font-size:13px;margin:14px 0;}
.calc-line{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-dim);}
.calc-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--line-soft);font-weight:700;color:var(--green);font-size:15px;}

.rate-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px;}
.rate-row:first-of-type{border-top:none;}
.emp-block{margin-bottom:18px;}
.emp-block h4{font-size:15px;margin-bottom:2px;}

.empty-state{text-align:center;padding:48px 16px;color:var(--text-dim);}
.empty-state .big{font-size:30px;margin-bottom:10px;}
#toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card-2);border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:10px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:all 0.25s ease;z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.viewer-note{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-title">WorkQuest</div>
  <div class="login-sub">Your work diary</div>
  <div class="pin-boxes" id="pinBoxes">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
    <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
  </div>
  <button class="login-btn" id="loginBtn" disabled onclick="attemptLogin()">Continue</button>
  <div class="login-loading hidden" id="loginLoading">Signing in…</div>
  <div class="login-error" id="loginError"></div>
</div>

<div id="app-screen" class="hidden">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">WorkQuest <span class="role-badge" id="roleBadge"></span></div>
      <div class="row">
        <div class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncText">—</span></div>
        <button class="icon-btn" onclick="openSearchModal()" title="Search">⌕</button>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">☀️</button>
        <button class="icon-btn" onclick="logout()" title="Log out">⎋</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="fy-pill" id="fyPillWrap"></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="diary" onclick="switchTab('diary')">Diary</button>
      <button class="tab" data-tab="calendar" onclick="switchTab('calendar')">Calendar</button>
      <button class="tab" data-tab="timeline" onclick="switchTab('timeline')">Timeline</button>
      <button class="tab" data-tab="tax" onclick="switchTab('tax')">Tax</button>
      <button class="tab" data-tab="settings" onclick="switchTab('settings')">Pay Rates</button>
    </div>
  </div>
  <div id="onShiftBanner" class="hidden"></div>
  <div class="section" id="content"></div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('wq_theme') || 'light');
</script>
<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const SUPABASE_URL = 'https://amppadqaygmfqtcsiesn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_O03dMgtLJEdG5RnmGPt2ng_dh2uQj8r';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Deterministic PIN -> credential mapping. See setup notes: create these two
// auth users in the Supabase dashboard with these exact passwords.
function credsForCode(code){
  return { email: `code-${code}@workquest.internal`, password: `WQ-${code}-Wq9x2LmP!` };
}
const ROLE_FOR_CODE = { '1703':'admin', '1804':'viewer' };

/* =========================================================================
   DATE / FY ENGINE (ported from original app, unchanged logic)
   ========================================================================= */
const DOW_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoFromParts(y,m,d){return `${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dateFromISO(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12,0,0));}
function isoFromDate(dt){return isoFromParts(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());}
function addDays(iso,n){const dt=dateFromISO(iso);dt.setUTCDate(dt.getUTCDate()+n);return isoFromDate(dt);}
function dowIndex(iso){return dateFromISO(iso).getUTCDay();}
function dowShort(iso){return DOW_SHORT[dowIndex(iso)];}
function isoCompare(a,b){return a<b?-1:(a>b?1:0);}
function getTodaySydney(){
  const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit'});
  const p=fmt.formatToParts(new Date());
  return `${p.find(x=>x.type==='year').value}-${p.find(x=>x.type==='month').value}-${p.find(x=>x.type==='day').value}`;
}
function formatAUShort(iso){const dt=dateFromISO(iso);return `${dt.getUTCDate()} ${MONTH_SHORT[dt.getUTCMonth()]}`;}
function formatWeekHeading(s,e){
  const sd=dateFromISO(s),ed=dateFromISO(e);
  const sameMonth=sd.getUTCMonth()===ed.getUTCMonth()&&sd.getUTCFullYear()===ed.getUTCFullYear();
  if(sameMonth) return `${sd.getUTCDate()} to ${ed.getUTCDate()} ${MONTH_LONG[ed.getUTCMonth()]}`;
  return `${sd.getUTCDate()} ${MONTH_SHORT[sd.getUTCMonth()]} to ${ed.getUTCDate()} ${MONTH_SHORT[ed.getUTCMonth()]}`;
}
function fyFromStartYear(startYear){
  const endYear=startYear+1;
  return {key:'FY'+String(endYear).slice(-2),startYear,endYear,start:isoFromParts(startYear,7,1),end:isoFromParts(endYear,6,30)};
}
function fyForDate(iso){
  const dt=dateFromISO(iso),y=dt.getUTCFullYear(),m=dt.getUTCMonth()+1;
  return fyFromStartYear(m>=7?y:y-1);
}
function weekForDate(iso){
  // Monday-Sunday weeks; first week of FY may start mid-week.
  const fy=fyForDate(iso);
  let cursor=fy.start,firstEnd=fy.start;
  while(dowIndex(firstEnd)!==0) firstEnd=addDays(firstEnd,1);
  if(isoCompare(firstEnd,fy.end)>0) firstEnd=fy.end;
  if(isoCompare(iso,fy.start)>=0 && isoCompare(iso,firstEnd)<=0) return {start:fy.start,end:firstEnd};
  cursor=addDays(firstEnd,1);
  while(isoCompare(cursor,fy.end)<=0){
    let end=addDays(cursor,6);
    if(isoCompare(end,fy.end)>0) end=fy.end;
    if(isoCompare(iso,cursor)>=0 && isoCompare(iso,end)<=0) return {start:cursor,end};
    cursor=addDays(end,1);
  }
  return {start:fy.start,end:firstEnd};
}

  2027:[['2027-01-01',true],['2027-01-26',true],['2027-03-26',true],['2027-03-27',true],['2027-03-28',true],['2027-03-29',true],
        ['2027-04-25',true],['2027-04-26',true],['2027-06-14',true],['2027-08-02',false],['2027-10-04',true],['2027-12-25',true],

};
function isPublicHoliday(iso){
  const year=parseInt(iso.slice(0,4),10);
  const list=NSW_HOLIDAYS_KNOWN[year]||[];
  const hit=list.find(h=>h[0]===iso);
  return !!(hit && hit[1]);
}

/* =========================================================================
   PAY ENGINE (ported from original app, unchanged logic)
   ========================================================================= */
function uid(prefix){return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function timeToMinutes(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function versionForDate(versions,iso){
  let best=null;
  for(const v of versions){ if(isoCompare(v.effectiveFrom,iso)<=0 && (!best||isoCompare(v.effectiveFrom,best.effectiveFrom)>0)) best=v; }
  return best||versions[0];
}
function overlapMinutes(aS,aE,bS,bE){const s=Math.max(aS,bS),e=Math.min(aE,bE);return Math.max(0,e-s);}
function computeBreakMinutes(shift,employer,rawMinutes){
  if(shift.breakMode==='manual') return shift.breakMinutesManual||0;
  const br=employer.breakRule;
  if(!br||!br.enabled) return 0;
  return (rawMinutes/60) > br.triggerHours ? br.breakMinutes : 0;
}
function calculateShiftPay(shift, employer){
  const result={grossPay:0,rawHours:0,paidHours:0,breakMinutes:0,breakdown:[],bonusBreakdown:[],holiday:false,employerName:employer?employer.name:'Unknown',overridden:false,noRateFound:false};
  if(!employer||!shift.start||!shift.end) return result;
  const startMin=timeToMinutes(shift.start);
  let endMin=timeToMinutes(shift.end);
  if(endMin<=startMin) endMin+=24*60;
  const rawMinutes=endMin-startMin;
  result.rawHours=rawMinutes/60;
  const breakMinutes=computeBreakMinutes(shift,employer,rawMinutes);
  result.breakMinutes=breakMinutes;
  const paidMinutes=Math.max(0,rawMinutes-breakMinutes);
  result.paidHours=paidMinutes/60;
  const isPH=isPublicHoliday(shift.date);
  result.holiday=isPH;
  const day=dowShort(shift.date);
  if(shift.rateOverride!=null && shift.rateOverride!==''){
    const amt=Number(shift.rateOverride);
    result.overridden=true;
    result.breakdown.push({label:'Custom rate',hours:result.rawHours,rate:amt,amount:amt*result.rawHours});
    result.grossPay=amt*result.paidHours;
  } else {
    let candidates=employer.rates.filter(r=> isPH ? r.days.includes('PH') : r.days.includes(day));
    if(!candidates.length && isPH) candidates=employer.rates.filter(r=>r.days.includes(day));
    if(!candidates.length) result.noRateFound=true;
    let grossRaw=0;
    for(const r of candidates){
      const winFrom=r.timeFrom?timeToMinutes(r.timeFrom):0;
      const winTo=r.timeTo?timeToMinutes(r.timeTo):24*60;
      const mins=overlapMinutes(startMin,endMin,winFrom,winTo);
      if(mins<=0) continue;
      const amt=versionForDate(r.versions,shift.date)?.amount||0;
      const hrs=mins/60;
      grossRaw+=amt*hrs;
      result.breakdown.push({label:r.label,hours:hrs,rate:amt,amount:amt*hrs});
    }
    const blended=result.rawHours>0?grossRaw/result.rawHours:0;
    result.grossPay=blended*result.paidHours;
  }
  let bonusTotal=0;
  if(!result.overridden){
    for(const b of (employer.bonuses||[])){
      const amt=versionForDate(b.versions,shift.date)?.amount||0;
      if(b.type==='per_hour'){ const v=amt*result.paidHours; bonusTotal+=v; result.bonusBreakdown.push({label:b.label,amount:v}); }
      else if(b.type==='per_shift'){ bonusTotal+=amt; result.bonusBreakdown.push({label:b.label,amount:amt}); }
    }
  }
  result.bonusTotal=bonusTotal;
  result.totalPay=result.grossPay+bonusTotal;
  return result;
}

async function attemptLogin(){
  const code = [...document.querySelectorAll('#pinBoxes input')].map(i=>i.value).join('');
  if(code.length!==4) return;
  const role = ROLE_FOR_CODE[code];
  setLoginBusy(true);
  const {email,password} = credsForCode(code);
  const {data,error} = await sb.auth.signInWithPassword({email,password});
  setLoginBusy(false);
  if(error || !role){
    showLoginError('Incorrect code');
    return;
  }
  STATE.role = role;
  STATE.uid = data.user.id;
  await afterLogin();
}
function setLoginBusy(b){
  document.getElementById('loginLoading').classList.toggle('hidden', !b);
  document.getElementById('loginBtn').disabled = b;
}
function showLoginError(msg){
  document.getElementById('loginError').textContent = msg;
  document.querySelectorAll('#pinBoxes input').forEach(i=>i.value='');
  document.querySelectorAll('#pinBoxes input')[0].focus();
}
async function afterLogin(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('roleBadge').textContent = STATE.role==='admin' ? 'Admin' : 'Viewer';
  if(STATE.role==='viewer'){
    ['settings','timeline','tax'].forEach(t=>document.querySelector(`[data-tab="${t}"]`).classList.add('hidden'));
  }
  initTheme();
  renderFyPill();
  setSync('saving','Loading…');
  if(STATE.role==='admin'){
    STATE.ownerId = STATE.uid;
    await loadAdminData();
    subscribeRealtimeAdmin();
  } else {
    // find which owner this viewer is linked to
    const {data:links} = await sb.from('viewer_links').select('owner_id').eq('viewer_id', STATE.uid).limit(1);
    if(!links || !links.length){ setSync('error','No linked account'); return; }
    STATE.ownerId = links[0].owner_id;
    await loadViewerData();
  }
  setSync('saved','Synced');
  render();
  if(STATE.role==='admin') startTickerWatcher();
}

async function loadAdminData(){

    // First run: seed defaults + historical shifts
    await seedAccount();
    ({data:employers} = await sb.from('employers').select('*').order('created_at'));
  }
  STATE.employers = (employers||[]).map(rowToEmployer);
  const {data:shifts} = await sb.from('shifts').select('*').order('date');

  const {data:planned} = await sb.from('planned_shifts').select('*').order('date');

}

}

function setSync(state,text){
  const dot=document.getElementById('syncDot'), t=document.getElementById('syncText');
  if(!dot) return;

  t.textContent=text;
}
window.addEventListener('offline', ()=> setSync('error','Offline'));
window.addEventListener('online', ()=>{ setSync('saving','Syncing…'); flushOfflineQueue(); });

async function flushOfflineQueue(){
  if(!offlineQueue.length){ setSync('saved','Synced'); return; }
  const queue=[...offlineQueue]; offlineQueue=[]; persistQueue();
  for(const op of queue){
    try{
      if(op.type==='upsert') await sb.from(op.table).upsert(op.row);
      if(op.type==='delete') await sb.from(op.table).delete().eq('id', op.id);
    }catch(e){ offlineQueue.push(op); }
  }
  persistQueue();
  setSync(offlineQueue.length?'error':'saved', offlineQueue.length?'⚠️ Unable to save':'Synced');
}
function persistQueue(){ localStorage.setItem('wq_offline_queue', JSON.stringify(offlineQueue)); }

/* Queue-aware write: tries the network, falls back to offline queue */
async function writeShift(row, isNew){
  setSync('saving','Saving…');
  localStorage.setItem('wq_cache_shifts', JSON.stringify(STATE.shifts)); // local cache
  if(!navigator.onLine){
    offlineQueue.push({type:'upsert', table:'shifts', row});
    persistQueue();
    setSync('error','Waiting to sync');
    return;
  }
  const {error} = await sb.from('shifts').upsert(row);
  if(error){
    offlineQueue.push({type:'upsert', table:'shifts', row});
    persistQueue();
    setSync('error','⚠️ Unable to save');
  } else {
    setSync('saved','Saved ✓');
  }
}
async function deleteShiftRow(id){
  setSync('saving','Saving…');
  if(!navigator.onLine){ offlineQueue.push({type:'delete', table:'shifts', id}); persistQueue(); setSync('error','Waiting to sync'); return; }
  const {error} = await sb.from('shifts').delete().eq('id', id);
  setSync(error?'error':'saved', error?'⚠️ Unable to save':'Saved ✓');
}

/* =========================================================================
   LIVE ON-SHIFT TICKER
   ========================================================================= */
function sydneyNowParts(){
  const fmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Sydney',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const p = fmt.formatToParts(new Date());
  const get=t=>p.find(x=>x.type===t).value;
  return {date:`${get('year')}-${get('month')}-${get('day')}`, minutesSinceMidnight: (+get('hour'))*60 + (+get('minute')) + (+get('second'))/60};
}
function findActiveShift(){
  if(STATE.role!=='admin') return null;
  const now = sydneyNowParts();
  const todays = STATE.shifts.filter(s=>s.date===now.date);
  for(const s of todays){
    const startMin = timeToMinutes(s.start);
    let endMin = timeToMinutes(s.end);
    if(endMin<=startMin) endMin += 24*60;
    if(now.minutesSinceMidnight>=startMin && now.minutesSinceMidnight<=endMin) return s;
  }
  return null;
}
function calcElapsedPay(shift, employer, nowMinSinceMidnight){
  const startMin = timeToMinutes(shift.start);
  let endMin = timeToMinutes(shift.end);
  if(endMin<=startMin) endMin += 24*60;
  const rawElapsed = Math.max(0, Math.min(nowMinSinceMidnight, endMin) - startMin);
  const br = employer.breakRule;
  const triggerMin = (br&&br.enabled) ? br.triggerHours*60 : Infinity;
  const brMin = (br&&br.enabled) ? br.breakMinutes : 0;
  let paidElapsed, onBreak=false;
  if(rawElapsed<=triggerMin){ paidElapsed = rawElapsed; }
  else if(rawElapsed<=triggerMin+brMin){ paidElapsed = triggerMin; onBreak=true; }
  else { paidElapsed = rawElapsed - brMin; }

  const isPH = isPublicHoliday(shift.date);
  const day = dowShort(shift.date);
  let candidates = employer.rates.filter(r=> isPH ? r.days.includes('PH') : r.days.includes(day));
  if(!candidates.length && isPH) candidates = employer.rates.filter(r=>r.days.includes(day));
  let grossRaw=0;
  for(const r of candidates){
    const winFrom=r.timeFrom?timeToMinutes(r.timeFrom):0;
    const winTo=r.timeTo?timeToMinutes(r.timeTo):24*60;
    const mins=overlapMinutes(startMin, startMin+rawElapsed, winFrom, winTo);
    if(mins<=0) continue;
    const amt=versionForDate(r.versions, shift.date)?.amount||0;
    grossRaw += amt*(mins/60);
  }
  const blended = rawElapsed>0 ? grossRaw/(rawElapsed/60) : 0;
  let amount = blended*(paidElapsed/60);
  for(const b of (employer.bonuses||[])){
    if(b.type==='per_hour'){
      const amt=versionForDate(b.versions, shift.date)?.amount||0;
      amount += amt*(paidElapsed/60);
    }
  }
  return { amount, paidElapsedMin:paidElapsed, rawElapsedMin:rawElapsed, onBreak };
}
let tickerBannerInterval=null, tickerModalInterval=null;
function startTickerWatcher(){
  refreshOnShiftBanner();
  clearInterval(tickerBannerInterval);
  tickerBannerInterval = setInterval(refreshOnShiftBanner, 20000);
}
function refreshOnShiftBanner(){
  const banner = document.getElementById('onShiftBanner');
  if(!banner) return;
  const active = findActiveShift();
  if(!active){ banner.classList.add('hidden'); banner.innerHTML=''; return; }
  const emp = getEmployer(active.employerId);
  banner.classList.remove('hidden');
  banner.innerHTML = `<div class="onshift-banner" onclick="openTickerModal('${active.id}')">
    <span class="onshift-dot"></span>
    <span class="label">On shift now — ${escapeHtml(emp?emp.name:'')}</span>
    <span class="amt" id="bannerAmt">…</span>
  </div>`;
  updateBannerAmt(active,emp);
}
function updateBannerAmt(shift,emp){
  const el = document.getElementById('bannerAmt');
  if(!el) return;
  const now = sydneyNowParts();
  const calc = calcElapsedPay(shift, emp, now.minutesSinceMidnight);
  el.textContent = '$'+calc.amount.toFixed(2);
}
function openTickerModal(shiftId){
  const shift = STATE.shifts.find(s=>s.id===shiftId);
  if(!shift) return;
  const emp = getEmployer(shift.employerId);
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>${escapeHtml(emp.name)}</h3>
    <p class="muted small" style="text-align:center;">${shift.start} → ${shift.end}</p>
    <div id="tickerBreakNote"></div>
    <div class="ticker-num money" id="tickerAmt">$0.00</div>
    <div class="ticker-sub" id="tickerElapsed">0:00 elapsed</div>
  `);
  clearInterval(tickerModalInterval);
  const tick = ()=>{
    const now = sydneyNowParts();
    const calc = calcElapsedPay(shift, emp, now.minutesSinceMidnight);
    const amtEl = document.getElementById('tickerAmt');
    if(!amtEl){ clearInterval(tickerModalInterval); return; }
    amtEl.textContent = '$'+calc.amount.toFixed(2);
    const h = Math.floor(calc.rawElapsedMin/60), m = Math.floor(calc.rawElapsedMin%60), s = Math.floor((calc.rawElapsedMin*60)%60);
    document.getElementById('tickerElapsed').textContent = `${h>0?h+'h ':''}${m}m ${s}s elapsed`;
    document.getElementById('tickerBreakNote').innerHTML = calc.onBreak ? `<div class="ticker-onbreak">On unpaid break — resumes shortly</div>` : '';
  };
  tick();
  tickerModalInterval = setInterval(tick, 1000);
}

   ========================================================================= */
let calCursor = getTodaySydney().slice(0,7); // 'YYYY-MM'
function renderCalendar(){
  const [y,m] = calCursor.split('-').map(Number);
  const monthStart = isoFromParts(y,m,1);
  const daysInMonth = new Date(Date.UTC(y,m,0)).getUTCDate();
  const startDow = (dowIndex(monthStart)+6)%7; // Monday-first offset
  const today = getTodaySydney();
  let html = `<div class="week-head">
    <button class="week-nav-btn" onclick="navCalMonth(-1)">‹</button>
    <div class="eyebrow">${MONTH_LONG[m-1]} ${y}</div>
    <button class="week-nav-btn" onclick="navCalMonth(1)">›</button>
  </div>
  <div class="cal-grid">`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = isoFromParts(y,m,d);
    const shifts = STATE.role==='admin' ? shiftsOnDate(iso) : STATE.shifts.filter(s=>s.date===iso);
    const isToday = iso===today;
    const holiday = STATE.role==='admin' && isHoliday(iso);
    const isFuture = isoCompare(iso,today)>0;
    let cls = 'cal-cell';
    if(isToday) cls += ' today';
    if(holiday) cls += ' holiday';
    else if(shifts.length && isFuture) cls += ' future';
    else if(shifts.length) cls += ' worked';
    let inner = `<span class="d">${d}</span>`;
    if(holiday){ inner += `<span class="na">N/A</span>`; }
    else if(STATE.role==='admin' && shifts.length){ inner += `<span class="amt">$${dayTotal(iso).toFixed(0)}</span>`; }
    else if(shifts.length){ inner += `<span class="dot"></span>`; }
    html += `<div class="${cls}"><button onclick="openDayModal('${iso}')">${inner}</button></div>`;
  }
  html += `</div>
  <div class="cal-legend">
    <span><span class="sw" style="background:var(--green-dim);"></span>Worked</span>
    <span><span class="sw" style="background:var(--amber-dim);"></span>Future shift</span>
    ${STATE.role==='admin'?`<span><span class="sw" style="background:var(--rust-dim);"></span>Holiday</span>`:''}
    <span><span class="sw" style="background:var(--accent);opacity:0.5;"></span>Today</span>
  </div>`;
  return html;
}
function navCalMonth(dir){
  let [y,m]=calCursor.split('-').map(Number);
  m+=dir; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  calCursor = `${y}-${String(m).padStart(2,'0')}`;
  render();
}
function openDayModal(iso){
  const shifts = STATE.role==='admin' ? shiftsOnDate(iso) : STATE.shifts.filter(s=>s.date===iso);

/* =========================================================================
   TIMELINE
   ========================================================================= */
function renderTimeline(){
  const fy = fyForDate(STATE.weekStart);
  let cursor = fy.start;
  const weeks = [];
  while(isoCompare(cursor, fy.end) <= 0){
    const w = weekForDate(cursor);
    weeks.push(w);
    cursor = addDays(w.end, 1);
  }
  const byMonth = {};
  for(const w of weeks){
    const monthKey = w.end.slice(0,7);
    (byMonth[monthKey] = byMonth[monthKey]||[]).push(w);
  }
  let html = `<h2 style="margin-bottom:6px;">${fy.key} timeline</h2><p class="muted small" style="margin-bottom:10px;">${fy.start} to ${fy.end}</p>`;
  for(const key of Object.keys(byMonth).sort()){
    const [y,m] = key.split('-').map(Number);
    html += `<div class="tl-month"><h3>${MONTH_LONG[m-1]} ${y}</h3>`;
    for(const w of byMonth[key]){
      const days = weekDays(w.start);
      const hrs = days.reduce((s,d)=>s+shiftsOnDate(d).reduce((a,x)=>a+x.locked.paidHours,0),0);
      const amt = days.reduce((s,d)=>s+dayTotal(d),0);
      if(hrs===0 && amt===0 && isoCompare(w.end, getTodaySydney())>0) continue;
      html += `<div class="tl-week"><span class="rng">${formatAUShort(w.start)} – ${formatAUShort(w.end)}</span><span class="hrs">${hrs.toFixed(1)} hrs</span><span class="amt">$${amt.toFixed(2)}</span></div>`;
    }
    html += `</div>`;
  }
  return html;
}

/* =========================================================================
   TAX (ATO FY27 resident rates — see ato.gov.au for current figures)
   ========================================================================= */
const TAX_BRACKETS = [
  {min:0, max:18200, rate:0},
  {min:18200, max:45000, rate:0.15},
  {min:45000, max:135000, rate:0.30},
  {min:135000, max:190000, rate:0.37},
  {min:190000, max:Infinity, rate:0.45},
];
const MEDICARE_LOWER = 27222;
const MEDICARE_UPPER = 34027;
function calcMedicareLevy(taxable){
  if(taxable<=MEDICARE_LOWER) return 0;
  if(taxable<=MEDICARE_UPPER) return (taxable-MEDICARE_LOWER)*0.10;
  return taxable*0.02;
}
function medicareRatePct(taxable){
  const levy = calcMedicareLevy(taxable);
  return taxable>0 ? (levy/taxable*100) : 0;
}
function calcIncomeTax(taxable){
  let tax=0;
  for(const b of TAX_BRACKETS){
    if(taxable>b.min){ tax += (Math.min(taxable,b.max)-b.min)*b.rate; }
  }
  return tax;
}
function currentBracket(taxable){
  return TAX_BRACKETS.slice().reverse().find(b=>taxable>b.min) || TAX_BRACKETS[0];
}
function renderTax(){
  const fy = fyForDate(STATE.weekStart);
  const gross = STATE.shifts.filter(s=>isoCompare(s.date,fy.start)>=0 && isoCompare(s.date,fy.end)<=0)
    .reduce((sum,s)=>sum+(s.locked?.totalPay||0),0);
  const tax = calcIncomeTax(gross);
  const medicare = calcMedicareLevy(gross);
  const total = tax + medicare;
  const bracket = currentBracket(gross);
  const net = gross - total;
  const maxScale = 190000;
  let barHtml = TAX_BRACKETS.map(b=>{
    const width = (Math.min(b.max,maxScale)-b.min)/maxScale*100;
    const color = b.rate===0?'var(--line-soft)': b.rate===bracket.rate?'var(--accent)':'var(--card-2)';
    return `<div class="seg" style="width:${width}%;background:${color};"></div>`;
  }).join('');
  return `
    ${renderPredictionCard(fy)}
    <div class="tax-hero">
      <span class="tax-estimate-badge">Estimate</span>
      <div class="eyebrow">${fy.key} gross earned</div>
      <div class="big-num money">$${gross.toFixed(2)}</div>
      <div class="muted small">Marginal rate ${(bracket.rate*100).toFixed(0)}% · bracket $${bracket.min.toLocaleString()}–${bracket.max===Infinity?'+':'$'+bracket.max.toLocaleString()}</div>
      <div class="bracket-bar">${barHtml}</div>
    </div>
    <div class="card card-pad">
      <div class="tax-row"><span class="muted">Gross income</span><span class="num">$${gross.toFixed(2)}</span></div>
      <div class="tax-row"><span class="muted">Estimated income tax</span><span class="num">$${tax.toFixed(2)}</span></div>
      <div class="tax-row"><span class="muted">Medicare levy (${medicareRatePct(gross).toFixed(2)}%)</span><span class="num">$${medicare.toFixed(2)}</span></div>
      <div class="tax-row"><span class="muted">Estimated total tax</span><span class="num">$${total.toFixed(2)}</span></div>
      <div class="tax-row"><span class="muted">Estimated take-home</span><span class="num" style="color:var(--green);font-weight:700;">$${net.toFixed(2)}</span></div>
    </div>
    <p class="muted small" style="margin-top:12px;">Income tax based on ${fy.key} ATO resident rates (0% to \$18,200, 15% to \$45,000, 30% to \$135,000, 37% to \$190,000, 45% above). Medicare levy phases in between \$27,222–\$34,027 at 10% of the amount over \$27,222, then applies at a flat 2% of total taxable income above that. Doesn't include PAYG already withheld, other income, deductions, or offsets like LITO — for an exact figure, check with the ATO or a tax agent.</p>
  `;
}
function renderPredictionCard(fy){
  const today = getTodaySydney();
  const inFY = isoCompare(today,fy.start)>=0 && isoCompare(today,fy.end)<=0;
  if(!inFY){
    return `<div class="card card-pad" style="margin-bottom:16px;"><div class="eyebrow">Prediction</div><p class="muted small">Not applicable — ${fy.key} is ${isoCompare(today,fy.start)<0?'in the future':'over'}.</p></div>`;
  }
  const daysElapsed = (dateFromISO(today)-dateFromISO(fy.start))/86400000 + 1;
  const totalFyDays = (dateFromISO(fy.end)-dateFromISO(fy.start))/86400000 + 1;
  const earnedSoFar = STATE.shifts.filter(s=>isoCompare(s.date,fy.start)>=0 && isoCompare(s.date,today)<=0)
    .reduce((sum,s)=>sum+(s.locked?.totalPay||0),0);
  if(daysElapsed<7 || earnedSoFar===0){
    return `<div class="card card-pad" style="margin-bottom:16px;"><div class="eyebrow">Prediction</div><p class="muted small">Not enough data yet — keep logging shifts and a projection will appear here.</p></div>`;
  }
  const dailyAvg = earnedSoFar/daysElapsed;
  const projectedTotal = dailyAvg*totalFyDays;
  const pctThroughYear = daysElapsed/totalFyDays*100;
  return `
    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="eyebrow">${fy.key} projected outcome</div>
      <div class="row wrap" style="align-items:baseline;gap:18px;margin-top:6px;">
        <div><div class="display" style="font-size:26px;">$${projectedTotal.toFixed(0)}</div><div class="muted small">projected total</div></div>
        <div><div class="display" style="font-size:18px;color:var(--green);">$${earnedSoFar.toFixed(2)}</div><div class="muted small">earned so far</div></div>
      </div>
      <div class="bracket-bar" style="margin-top:14px;"><div class="seg" style="width:${pctThroughYear.toFixed(1)}%;background:var(--accent);"></div></div>
      <p class="muted small" style="margin-top:6px;">${pctThroughYear.toFixed(0)}% through ${fy.key}, based on your $${dailyAvg.toFixed(2)}/day average so far.</p>
    </div>`;
}

function runSearch(){

  }).sort((a,b)=>b.date<a.date?-1:1).slice(0,30);

function weekDays(weekStart){
  const days=[]; let d=weekStart;

  while(isoCompare(d,end)<=0){ days.push(d); d=addDays(d,1); }
  return days;
}

    for(const r of emp.rates){
      const cur = versionForDate(r.versions, getTodaySydney());
      const upcoming = r.versions.filter(v=>isoCompare(v.effectiveFrom, getTodaySydney())>0).sort((a,b)=>isoCompare(a.effectiveFrom,b.effectiveFrom))[0];
      html += `<div class="rate-row" onclick="openEditRateModal('${emp.id}','${r.id}')" style="cursor:pointer;">
        <span class="muted">${escapeHtml(r.label)}${upcoming?`<div class="rate-hist small" style="color:var(--amber);">→ $${upcoming.amount.toFixed(2)} from ${fmtDateShort(upcoming.effectiveFrom)}</div>`:''}</span>
        <span class="num">$${cur.amount.toFixed(2)}</span>
      </div>`;
    }
    for(const b of (emp.bonuses||[])){
      const cur = versionForDate(b.versions, getTodaySydney());
      html += `<div class="rate-row" onclick="openEditBonusModal('${emp.id}','${b.id}')" style="cursor:pointer;"><span class="muted">${escapeHtml(b.label)}</span><span class="num">$${cur.amount.toFixed(2)} ${b.type==='per_hour'?'/hr':'/shift'}</span></div>`;
    }
    html += `</div>`;
  }
  html += `<button class="btn btn-block" onclick="openAddJobModal()">+ Add job</button>`;
  return html;
}
function fmtDateShort(iso){ return formatAUShort(iso); }
function tomorrowSydney(){ return addDays(getTodaySydney(),1); }

async function saveEmployer(emp){
  setSync('saving','Saving…');
  const row = { id:emp.id, owner_id:STATE.uid, name:emp.name, rates:emp.rates, bonuses:emp.bonuses, break_rule:emp.breakRule };
  if(!navigator.onLine){ offlineQueue.push({type:'upsert', table:'employers', row}); persistQueue(); setSync('error','Waiting to sync'); return; }
  const {error} = await sb.from('employers').upsert(row);
  setSync(error?'error':'saved', error?'⚠️ Unable to save':'Saved ✓');
  if(error){ offlineQueue.push({type:'upsert', table:'employers', row}); persistQueue(); }
}

  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>+ Add job</h3>
    <div class="field"><label>Job name</label><input type="text" id="jName" placeholder="e.g. Woolworths"></div>
    <div class="field-row">
      <div class="field"><label>Starting rate ($/hr)</label><input type="number" step="0.01" id="jRate" value="0.00"></div>
      <div class="field"><label>Effective from</label><input type="date" id="jFrom" value="${getTodaySydney()}"></div>
    </div>

    <div class="row wrap"><button class="btn btn-primary" onclick="saveNewJob()">Add job</button><button class="btn" onclick="closeModal()">Cancel</button></div>

async function saveNewJob(){
  const name = document.getElementById('jName').value.trim();
  const rate = Number(document.getElementById('jRate').value);
  const from = document.getElementById('jFrom').value;
  const breakOn = document.getElementById('jBreak').value==='on';
  if(!name || isNaN(rate) || !from){ toast('Fill in all fields'); return; }
  const emp = {
    id: uid('emp'), name,
    rates: [ mkRate('All days',['Mon','Tue','Wed','Thu','Fri','Sat','Sun','PH'], null, null, rate) ],
    bonuses: [],
    breakRule: {enabled:breakOn, triggerHours:5, breakMinutes:30},
  };
  emp.rates[0].versions = [{amount:rate, effectiveFrom:from}];
  STATE.employers.push(emp);
  await saveEmployer(emp);
  closeModal(); render();
  toast('Job added');
}
function openEditJobModal(empId){
  const emp = getEmployer(empId);
  const hasShifts = STATE.shifts.some(s=>s.employerId===empId);
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>Edit job</h3>
    <div class="field"><label>Job name</label><input type="text" id="jEditName" value="${escapeHtml(emp.name)}"></div>
    <div class="row wrap"><button class="btn btn-primary" onclick="saveJobName('${empId}')">Save name</button></div>
    <hr style="border:none;border-top:1px solid var(--line-soft);margin:18px 0;">
    <p class="muted small">${hasShifts?"This job has shifts recorded against it, so it can't be fully deleted — but you can rename it or set its rates to $0 to retire it.":'No shifts recorded against this job yet — safe to delete.'}</p>
    ${!hasShifts?`<button class="btn btn-danger btn-block" onclick="deleteJob('${empId}')">Delete job</button>`:''}
  `);
}
async function saveJobName(empId){
  const emp = getEmployer(empId);
  const name = document.getElementById('jEditName').value.trim();
  if(!name){ toast('Enter a name'); return; }
  emp.name = name;
  await saveEmployer(emp);
  closeModal(); render();
  toast('Job updated');
}
async function deleteJob(empId){
  if(!confirm('Delete this job? This cannot be undone.')) return;
  setSync('saving','Saving…');
  const {error} = await sb.from('employers').delete().eq('id', empId);
  if(error){ toast('Could not delete — it may have shifts recorded against it'); setSync('error','⚠️ Unable to save'); return; }
  STATE.employers = STATE.employers.filter(e=>e.id!==empId);
  setSync('saved','Saved ✓');
  closeModal(); render();
  toast('Job deleted');
}
function navWeek(dir){
  STATE.weekStart = addDays(weekForDate(STATE.weekStart).start, dir*7);
  renderFyPill();
  render();
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================================
   ADD / EDIT SHIFT MODAL
   ========================================================================= */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; clearInterval(tickerModalInterval); }
function openAddShiftModal(){
  renderShiftModal(null);
}
function openEditShiftModal(id){
  renderShiftModal(STATE.shifts.find(s=>s.id===id));
}
function renderShiftModal(existing){
  const empOptions = STATE.employers.map(e=>`<option value="${e.id}" ${existing&&existing.employerId===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('');
  const fy = fyForDate(existing?existing.date:getTodaySydney());
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>${existing?'Edit shift':'+ Add shift'}</h3>
    <div class="field"><label>Date</label><input type="date" id="sDate" value="${existing?existing.date:getTodaySydney()}" onchange="updateCalcPreview();checkPatternHint();"></div>
    <div class="field"><label>Employer</label><select id="sEmp" onchange="updateCalcPreview();checkPatternHint();">${empOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Start</label><input type="time" id="sStart" value="${existing?existing.start:'16:00'}" oninput="updateCalcPreview();checkPatternHint();"></div>
      <div class="field"><label>End</label><input type="time" id="sEnd" value="${existing?existing.end:'19:30'}" oninput="updateCalcPreview();checkPatternHint();"></div>
    </div>
    <div class="field"><label>Notes</label><input type="text" id="sNotes" value="${existing?escapeHtml(existing.notes||''):''}"></div>
    <div id="patternHint"></div>
    ${!existing?`
    <div class="field" style="display:flex;align-items:center;gap:8px;margin-top:4px;">
      <input type="checkbox" id="sRepeat" style="width:auto;" onchange="document.getElementById('repeatUntilWrap').classList.toggle('hidden',!this.checked)">
      <label style="margin:0;text-transform:none;font-size:14px;font-weight:500;color:var(--text);">Repeats weekly</label>
    </div>
    <div class="field hidden" id="repeatUntilWrap"><label>Repeat until</label><input type="date" id="sRepeatUntil" value="${fy.end}"></div>
    `:''}
    <div class="calc-preview" id="calcPreview"></div>
    <div class="row wrap">
      <button class="btn btn-primary" onclick="saveShiftModal('${existing?existing.id:''}')">${existing?'Save changes':'Add shift'}</button>
      ${existing?`<button class="btn btn-danger" onclick="deleteShiftModal('${existing.id}')">Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `);
  updateCalcPreview();
  if(!existing) checkPatternHint();
}
function checkPatternHint(){
  const hintEl = document.getElementById('patternHint');
  if(!hintEl) return;
  const empId=document.getElementById('sEmp').value;
  const date=document.getElementById('sDate').value;
  const start=document.getElementById('sStart').value;
  const end=document.getElementById('sEnd').value;
  if(!date){ hintEl.innerHTML=''; return; }
  const dow = dowIndex(date);
  const matches = STATE.shifts.filter(s=>s.employerId===empId && dowIndex(s.date)===dow && s.start===start && s.end===end);
  if(matches.length>=3){
    hintEl.innerHTML = `<div class="viewer-note" style="border-color:var(--accent);">You often work this pattern on ${DOW_LONG[dow]}s — <a href="#" onclick="document.getElementById('sRepeat').checked=true;document.getElementById('repeatUntilWrap').classList.remove('hidden');this.parentElement.remove();return false;" style="color:var(--accent);">make this recurring?</a></div>`;
  } else {
    hintEl.innerHTML = '';
  }
}
function updateCalcPreview(){
  const empId=document.getElementById('sEmp').value;
  const date=document.getElementById('sDate').value;
  const start=document.getElementById('sStart').value;
  const end=document.getElementById('sEnd').value;
  const emp=getEmployer(empId);
  if(!emp||!date||!start||!end) return;
  const calc=calculateShiftPay({date,start,end,breakMode:'auto',rateOverride:null}, emp);
  let html = calc.breakdown.map(b=>`<div class="calc-line"><span>${escapeHtml(b.label)} (${b.hours.toFixed(2)}h)</span><span>$${b.amount.toFixed(2)}</span></div>`).join('');
  if(calc.breakMinutes>0) html += `<div class="calc-line"><span>Unpaid break</span><span>-${calc.breakMinutes} min</span></div>`;
  calc.bonusBreakdown.forEach(b=> html += `<div class="calc-line"><span>${escapeHtml(b.label)}</span><span>$${b.amount.toFixed(2)}</span></div>`);
  html += `<div class="calc-total"><span>Total (${calc.paidHours.toFixed(2)} paid hrs)</span><span>$${calc.totalPay.toFixed(2)}</span></div>`;
  document.getElementById('calcPreview').innerHTML = html;
}
async function saveShiftModal(existingId){
  const empId=document.getElementById('sEmp').value;
  const date=document.getElementById('sDate').value;
  const start=document.getElementById('sStart').value;
  const end=document.getElementById('sEnd').value;
  const notes=document.getElementById('sNotes').value;
  const emp=getEmployer(empId);
  const repeatEl = document.getElementById('sRepeat');
  const repeating = repeatEl && repeatEl.checked;
  const repeatUntil = repeating ? document.getElementById('sRepeatUntil').value : null;

  const dates = [date];
  if(repeating && repeatUntil && isoCompare(repeatUntil,date)>=0){
    let d = addDays(date,7);
    while(isoCompare(d,repeatUntil)<=0){
      if(!isHoliday(d)) dates.push(d);
      d = addDays(d,7);
    }
  }
  const rows=[];
  for(const d of dates){
    if(isHoliday(d)) continue;
    const draft={date:d,start,end,breakMode:'auto',breakMinutesManual:null,rateOverride:null};
    const locked=calculateShiftPay(draft,emp);
    const id = (d===date && existingId) ? existingId : uid('shift');
    const row = {
      id, owner_id:STATE.uid, date:d, employer_id:empId, start_time:start, end_time:end,
      break_mode:'auto', break_minutes_manual:null, notes, pay_date:null, rate_override:null, locked_calc:locked,
    };
    rows.push(row);
    const shiftObj = rowToShift(row);
    const idx = STATE.shifts.findIndex(s=>s.id===id);
    if(idx>=0) STATE.shifts[idx]=shiftObj; else STATE.shifts.push(shiftObj);
  }
  closeModal(); render();
  for(const row of rows) await writeShift(row);
  toast(existingId?'Shift updated': rows.length>1?`${rows.length} shifts added`:'Shift added');
}
async function deleteShiftModal(id){
  if(!confirm('Delete this shift?')) return;
  STATE.shifts = STATE.shifts.filter(s=>s.id!==id);
  closeModal(); render();
  await deleteShiftRow(id);
  toast('Shift deleted');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================================
   PIN INPUT UX
   ========================================================================= */
(function initPinBoxes(){
  const boxes=[...document.querySelectorAll('#pinBoxes input')];
  boxes.forEach((box,i)=>{
    box.addEventListener('input',()=>{
      box.value = box.value.replace(/[^0-9]/g,'');
      if(box.value && i<boxes.length-1) boxes[i+1].focus();
      document.getElementById('loginBtn').disabled = boxes.some(b=>!b.value);
    });
    box.addEventListener('keydown',(e)=>{
      if(e.key==='Backspace' && !box.value && i>0) boxes[i-1].focus();
      if(e.key==='Enter' && !document.getElementById('loginBtn').disabled) attemptLogin();
    });
  });
  boxes[0].focus();
})();

/* =========================================================================
   INIT — restore session if one exists
   ========================================================================= */
(async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    const code = session.user.email.match(/^code-(\d+)@/)?.[1];
    const role = ROLE_FOR_CODE[code];
    if(role){
      STATE.role=role; STATE.uid=session.user.id;
      await afterLogin();
      return;
    }
  }
})();
